# Builds the mod jar and runs the automated in-game tests on every push.
name: build
on: [pull_request, push, workflow_dispatch]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - run: chmod +x ./gradlew
      - run: ./gradlew build
      - uses: actions/upload-artifact@v7
        with:
          name: long-eyes-jar
          path: build/libs/

  dedicated_server_test:
    # Starts a real dedicated server with the mod: proves no client classes are loaded server-side.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - run: chmod +x ./gradlew
      - name: run dedicated server until "Done"
        run: |
          mkdir -p run && echo "eula=true" > run/eula.txt
          printf 'online-mode=false\nlevel-type=minecraft\\:flat\n' > run/server.properties
          ./gradlew runServer > server.log 2>&1 &
          for i in $(seq 1 120); do
            if grep -q 'Done (' server.log; then echo "SERVER STARTED"; break; fi
            sleep 5
          done
          sleep 10
          pkill -f 'net.fabricmc' || true
          grep -E 'longeyes|Long Eyes|Done \(' server.log || true
          if ! grep -q 'Done (' server.log; then tail -100 server.log; exit 1; fi
          if grep -E 'Exception|Error' server.log | grep -iv 'deprecat'; then echo "errors in server log"; exit 1; fi

  client_gametest:
    # Real client + real dedicated server, scripted input, screenshots.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - run: chmod +x ./gradlew
      - run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri mesa-utils
      - run: xvfb-run -a -s "-screen 0 1920x1080x24" ./gradlew runClientGameTest --stacktrace
      - name: publish screenshots to branch test-screenshots
        if: always() && github.event_name == 'push'
        run: |
          mkdir -p /tmp/shots
          cp -r build/run/clientGameTest/screenshots/. /tmp/shots/ 2>/dev/null || true
          cp build/run/clientGameTest/logs/latest.log /tmp/shots/latest.log 2>/dev/null || true
          cd /tmp/shots
          git init -q -b test-screenshots
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Game test screenshots for ${GITHUB_SHA}" || exit 0
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" test-screenshots
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: gametest-screenshots
          path: build/run/clientGameTest/screenshots
