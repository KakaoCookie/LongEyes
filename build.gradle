plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

base {
	archivesName = 'long-eyes'
}

repositories {
	// Loom adds the Mojang and Fabric repositories automatically.
}

loom {
	// Strict client/server separation: everything in src/client is never loaded on a dedicated server.
	splitEnvironmentSourceSets()

	mods {
		"longeyes" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

	runs {
		// Second client for local multiplayer tests (./gradlew runClient2 while a server runs).
		client2 {
			client()
			configName = "Minecraft Client 2"
			programArgs "--username", "EyeTester2"
			runDir "run-client2"
		}
	}
}

// Automated in-game tests (dedicated server + real client), see src/gametest.
fabricApi {
	configureTests {
		createSourceSet = true
		modId = "longeyes-gametest"
		eula = true
		username = "EyeTester"
		enableGameTests = false
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = 'UTF-8'
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName" }
	}
}
